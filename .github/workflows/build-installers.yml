name: Build Installers

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build-installers:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS DMG
            platform: macos-latest
            build_args: "--bundles dmg --target universal-apple-darwin --ci --no-sign"
            artifact_name: record-screen-macos-dmg
            artifact_path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: Windows MSI
            platform: windows-latest
            build_args: "--bundles msi --ci --no-sign"
            artifact_name: record-screen-windows-msi
            artifact_path: target/release/bundle/msi/*.msi
          - name: Linux AppImage
            platform: ubuntu-22.04
            build_args: "--bundles appimage --ci --no-sign"
            artifact_name: record-screen-linux-appimage
            artifact_path: target/release/bundle/appimage/*.AppImage*

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        if: matrix.platform != 'macos-latest'
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust stable with universal Apple targets
        if: matrix.platform == 'macos-latest'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Restore Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run build -- ${{ matrix.build_args }}

      - name: Show bundle outputs
        if: always()
        shell: bash
        run: find target -type f | sort | grep '/bundle/' || true

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
