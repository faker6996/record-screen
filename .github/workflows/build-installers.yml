name: Build Installers

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags-ignore:
      - '*'

permissions:
  contents: write

jobs:
  build-installers:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS DMG
            platform: macos-latest
            build_args: "--bundles dmg --target universal-apple-darwin --ci --no-sign"
            artifact_name: record-screen-macos-dmg
            artifact_path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: Windows MSI
            platform: windows-latest
            build_args: "--bundles msi --ci --no-sign"
            artifact_name: record-screen-windows-msi
            artifact_path: target/release/bundle/msi/*.msi
          - name: Linux AppImage
            platform: ubuntu-22.04
            build_args: "--bundles appimage --ci --no-sign"
            artifact_name: record-screen-linux-appimage
            artifact_path: target/release/bundle/appimage/*.AppImage*

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        if: matrix.platform != 'macos-latest'
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust stable with universal Apple targets
        if: matrix.platform == 'macos-latest'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Restore Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run build -- ${{ matrix.build_args }}

      - name: Show bundle outputs
        if: always()
        shell: bash
        run: find target -type f | sort | grep '/bundle/' || true

      - name: Upload installer artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  tag-version:
    name: Tag successful main build
    runs-on: ubuntu-22.04
    needs: build-installers
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read and validate app version
        id: version
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAURI_VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          CARGO_VERSION="$(awk '
            /^\[workspace\.package\]$/ { in_section = 1; next }
            /^\[/ { in_section = 0 }
            in_section && /^version = / {
              gsub(/^version = "/, "", $0)
              gsub(/"$/, "", $0)
              print
              exit
            }
          ' Cargo.toml)"

          if [ -z "$PACKAGE_VERSION" ] || [ -z "$TAURI_VERSION" ] || [ -z "$CARGO_VERSION" ]; then
            echo "Unable to determine one or more versions."
            exit 1
          fi

          if [ "$PACKAGE_VERSION" != "$TAURI_VERSION" ] || [ "$PACKAGE_VERSION" != "$CARGO_VERSION" ]; then
            echo "Version mismatch detected."
            echo "package.json: $PACKAGE_VERSION"
            echo "src-tauri/tauri.conf.json: $TAURI_VERSION"
            echo "Cargo.toml: $CARGO_VERSION"
            exit 1
          fi

          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if version tag already exists
        id: tag_check
        shell: bash
        run: |
          if git rev-parse -q --verify "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push version tag
        if: steps.tag_check.outputs.exists == 'false'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Report existing version tag
        if: steps.tag_check.outputs.exists == 'true'
        run: echo "Tag ${{ steps.version.outputs.tag }} already exists. Skipping auto-tag."
