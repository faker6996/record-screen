[package]
name = "record-screen-desktop"
version.workspace = true
edition.workspace = true

[lib]
name = "record_screen_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
app-core = { path = "../crates/app-core" }
capture = { path = "../crates/capture" }
permissions = { path = "../crates/permissions" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
shortcuts = { path = "../crates/shortcuts" }
storage = { path = "../crates/storage" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }

[target.'cfg(target_os = "macos")'.dependencies]
capture-macos = { path = "../crates/capture-macos" }
